name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin_app/**'
      - '.github/workflows/flutter-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: |
          flutter create \
            --platforms=android \
            --org=com.herotux \
            --project-name=menu_admin \
            build_app

      - name: Configure Android NDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_app/android/app/build.gradle.kts")
          s = p.read_text()

          if 'ndkVersion = "27.0.12077973"' not in s:
              s = s.replace(
                  'android {',
                  'android {\n    ndkVersion = "27.0.12077973"',
                  1
              )

          p.write_text(s)
          PY

      - name: Copy admin app source
        run: |
          rm -rf build_app/lib
          cp -r admin_app/lib build_app/lib

          rm -rf build_app/assets
          cp -r admin_app/assets build_app/assets

          cp admin_app/pubspec.yaml build_app/pubspec.yaml

      - name: Configure Android Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_app/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in s:
              s = s.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          p.write_text(s)
          PY

      - name: Remove generated example test
        run: rm -rf build_app/test

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Analyze
        working-directory: build_app
        run: flutter analyze

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soran-menu-admin-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
