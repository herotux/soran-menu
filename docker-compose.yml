services:

  api:
    build:
      context: ./backend
    container_name: menu_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://menu:menu_password@postgres:5432/menu_db
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: menu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: menu_db
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: menu_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu -d menu_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
