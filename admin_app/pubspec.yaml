name: soransib
description: Persian RTL admin app for SoranSib digital menu management.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.4.0
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  image_picker: ^1.1.2
  uuid: ^4.5.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/logo.png
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground: assets/icon/logo.png
  min_sdk_android: 21
